[project]
name = "envdiff"
version = "0.1.0"
description = "Deterministic environment contract analysis for repositories."
authors = [{name = "davisbuilds"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.11.0,<3.0.0",
  "rich>=14.0.0,<15.0.0",
  "typer>=0.17.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[project.scripts]
envdiff = "src.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
