version: "2"

linters:
  enable:
    - misspell
    - unconvert
    - unparam
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    errcheck:
      # WHY: writes to stdout/stderr (help text, diagnostics) have nothing useful to
      # do with a returned error in a CLI.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofumpt
