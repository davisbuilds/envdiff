version: "2"

# WHY: the defaults already enable errcheck, govet, ineffassign, staticcheck, and
# unused; unused plus staticcheck's U1000 are the cross-file dead-code gate. The
# extras below add style and correctness checks that fit a small, deterministic CLI.
linters:
  enable:
    - misspell
    - unconvert
    - unparam
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    errcheck:
      # WHY: writes to stdout/stderr (help text, diagnostics) have nothing useful to
      # do with a returned error in a CLI.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofumpt
